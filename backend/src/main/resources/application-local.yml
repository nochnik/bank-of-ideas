spring:
  datasource:
    url: jdbc:h2:file:./data/bankideas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  storage:
    path: ./data/uploads
  public-api-url: http://localhost:8080
  cors:
    allowed-origin-patterns: http://localhost:5173,http://127.0.0.1:5173
